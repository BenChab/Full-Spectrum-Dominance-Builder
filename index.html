<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>FSD - Army Builder</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main id="app">
            <section id="faction-select" class="center-page">
                <h1>Choisissez une faction</h1>
                <div class="faction-grid" id="factionGrid">
                    <!-- Boutons injectés par JS -->
                </div>
            </section>

            <section id="unit-builder" class="hidden">
                <header class="builder-header">
                    <button id="backBtn" class="link-btn">← Retour</button>
                    <h2 id="selectedFactionName">Faction</h2>
                    <div class="controls">
                        <label for="pointLimit">Limite de points</label>
                        <select id="pointLimit">
                            <option value="40">40 pts</option>
                            <option value="60" selected>60 pts</option>
                            <option value="80">80 pts</option>
                        </select>
                        <button id="openAddUnit" class="primary">Ajouter une unité</button>
                    </div>
                </header>

                <section class="list-area">
                    <div class="status">
                        <span>Points utilisés: <strong id="usedPoints">0</strong></span>
                        <span>Limite: <strong id="limitPoints">60</strong></span>
                    </div>

                    <ul id="unitList" class="unit-list">
                        <!-- Unités ajoutées apparaissent ici -->
                    </ul>
                </section>
            </section>

            <!-- Modal: sélection d'unités -->
            <div id="unitsModal" class="modal hidden">
                <div class="modal-content">
                    <button class="modal-close" id="closeUnitsModal">✕</button>
                    <h3 id="modalTitle">Unités disponibles</h3>
                    <ul id="availableUnits" class="available-list">
                        <!-- Chargé depuis data/*.json -->
                    </ul>
                </div>
            </div>

            <!-- Modal: aperçu image -->
            <div id="imageModal" class="modal hidden">
                <div class="modal-content image-content">
                    <button class="modal-close" id="closeImageModal">✕</button>
                    <img id="previewImage" src="" alt="Carte unité" />
                    <p id="previewName"></p>
                </div>
            </div>
        </main>

        <script src="js/app.js" defer></script>
    </body>
</html>
